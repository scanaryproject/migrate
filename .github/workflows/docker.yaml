name: Build and push docker image

on:
  push:
    branches: ["master"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag (e.g., v1.2.3 or my-feature-branch)"
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: scanaryproject/migrate

jobs:
  build-and-push-docker-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get current Unix timestamp
        id: unixtime
        run: echo "timestamp=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # master push -> :<unix timestamp> and :latest (same scheme as scanaryd)
          # dispatch    -> :<image_tag>
          tags: |
            type=raw,value=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.image_tag || '' }}
            type=raw,value=${{ github.event_name == 'push' && steps.unixtime.outputs.timestamp || '' }}
            type=raw,value=${{ github.event_name == 'push' && 'latest' || '' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            VERSION=${{ github.event_name == 'push' && steps.unixtime.outputs.timestamp || github.event.inputs.image_tag }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
